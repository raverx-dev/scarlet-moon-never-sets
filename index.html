function hz(n){if(!n||n==='R')return 0;const m=/^([A-G])([#b]?)(\d)$/.exec(n);if(!m)return 0;return 440*Math.pow(2,(({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]])+(m[2]==='#'?1:m[2]==='b'?-1:0)+(Number(m[3])+1)*12-69)/12)}

function audioInit(){if(ac){if(ac.state==='suspended')ac.resume().catch(()=>{});return}try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:0.22;master.connect(ac.destination);for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();if(i===2)o.type='triangle';else o.setPeriodicWave(pulseWave(i===0?.25:.125));g.gain.value=0;o.connect(g);g.connect(master);o.start();voices.push({o,g})}sfxOsc=ac.createOscillator();sfxGain=ac.createGain();sfxOsc.setPeriodicWave(pulseWave(.25));sfxGain.gain.value=0;sfxOsc.connect(sfxGain);sfxGain.connect(master);sfxOsc.start();const buf=ac.createBuffer(1,32767,ac.sampleRate);let lfsr=1;for(let i=0;i<buf.length;i++){lfsr=(lfsr>>1)|(((lfsr^(lfsr>>1))&1)<<14);buf.getChannelData(0)[i]=(lfsr&1)?1:-1}noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;noiseGain=ac.createGain();noiseGain.gain.value=0;noiseFilter=ac.createBiquadFilter();noiseFilter.type='highpass';noiseFilter.frequency.value=1800;noise.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.connect(master);noise.start();musicNext=ac.currentTime;audioTimer=setInterval(audioPump,25);if(state==='boot'||state==='notice'){tone(0,660,ac.currentTime,.11,.22);tone(0,990,ac.currentTime+.15,.19,.22)}else sound('menu')}catch(e){ac=null}}
function music(n){musicName=n;musicStep=0;if(ac){musicNext=ac.currentTime+0.03;for(const v of voices){v.g.gain.cancelScheduledValues(musicNext);v.g.gain.setValueAtTime(0,musicNext)}if(noiseGain){noiseGain.gain.cancelScheduledValues(musicNext);noiseGain.gain.setValueAtTime(0,musicNext)}}}
function tone(i,f,t,d,v=.2){const {o,g}=voices[i];o.frequency.setValueAtTime(Math.max(20,f),t);g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(f?v:0,t);g.gain.setValueAtTime(0,t+Math.max(.015,d*.86))}

function hitNoise(kind,t){const table={k:[.14,.045,220],s:[.12,.055,1400],h:[.04,.018,6500],o:[.07,.08,4000],c:[.10,.18,2500],t:[.10,.04,700]};const p=table[kind];if(!p||!noiseGain)return;if(noiseFilter)noiseFilter.frequency.setValueAtTime(p[2],t);noiseGain.gain.cancelScheduledValues(t);noiseGain.gain.setValueAtTime(p[0],t);noiseGain.gain.setValueAtTime(0,t+p[1])}
function audioPump(){if(!ac)return;const s=SONGS[musicName];if(paused||!s){for(const v of voices)v.g.gain.setTargetAtTime(0,ac.currentTime,.01);if(noiseGain)noiseGain.gain.setTargetAtTime(0,ac.currentTime,.01);musicNext=ac.currentTime+.05;return}let dt=60/s.bpm/4;if(boss?.data.id==='r5'&&boss.t>24*60)dt*=.94;const total=s.totalSteps,loopStart=s.loopStart||0;while(musicNext<ac.currentTime+.09){if(musicNext<ac.currentTime-.1)musicNext=ac.currentTime;if(musicStep>=total)musicStep=loopStart;const i=musicStep,p1=s.tracks.p1[i],p2=s.tracks.p2[i],tri=s.tracks.tri[i],noi=s.tracks.noi[i];if(p1){if(p1.n==='R')silence(0,musicNext);else tone(0,hz(p1.n),musicNext,dt*p1.len,.18)}if(p2&&musicNext>sfxUntil){if(p2.n==='R')silence(1,musicNext);else tone(1,hz(p2.n),musicNext,dt*p2.len,.08)}if(tri){if(tri.n==='R')silence(2,musicNext);else tone(2,hz(tri.n),musicNext,dt*tri.len,.26)}if(noi&&noi.n!=='R')hitNoise(noi.n,musicNext);musicStep++;musicNext+=dt}}

function tick(){frame++;if(pressed.m){muted=!muted;if(master){master.gain.cancelScheduledValues(ac.currentTime);master.gain.value=muted?0:.22}}if(state==='play'&&pressed.enter){paused=!paused;sound('pause')}if(paused){if(pressed.x)toTitle();pressed={};return}stateTick++;

else if(state==='notice'&&(stateTick>310||pressed.z||pressed.enter))toTitle();
else if(state==='title'){if(pressed.arrowup||pressed.arrowdown){menu=1-menu;stateTick=0;sound('menu')}if(pressed.z||pressed.enter){sound('menu');if(menu===0)newRun();else setState('how')}else if(stateTick>600){setState('attract');music('title')}}
else if(state==='how'&&(pressed.z||pressed.x||pressed.enter))toTitle();
else if(state==='attract'){if(pressed.z||pressed.enter||pressed.x||stateTick>1270)toTitle()}
else if(state==='dialogue'){dialogue.print+=.8;let s=dialogue.lines[dialogue.index][1];if(pressed.z||pressed.enter||pressed.x){if(dialogue.print<s.length)dialogue.print=s.length;else {dialogue.index++;dialogue.print=0;sound('menu');if(dialogue.index>=dialogue.lines.length)finishDialogue()}}}
else if(state==='stagecard'&&stateTick>=150){phaseGap=0;setState('play')}
else if(state==='gate'&&stateTick>=240)setState('stagecard');
else if(state==='play')playStep();
else if(state==='continue'){if(pressed.z||pressed.enter)continueRun();else if(pressed.x||stateTick>=600)toTitle()}
else if(state==='defeat'&&stateTick>=130)afterDefeat();
else if(state==='dawn'&&stateTick>=370){setState('endingScene');sound('ending')}
else if(state==='endingScene'&&stateTick>=480)showDialogue('ending',()=>{setState('endingExit');sound('ending')},'morning');
else if(state==='endingExit'&&stateTick>=170){setState('theend');sound('ending')}

else if(state==='credits'){if(stateTick%300===1)sound('ending');if(stateTick>=1800)setState('final')}
else if(state==='final'&&(pressed.enter||pressed.z))toTitle();pressed={};}
let previous=0,accumulator=0;function loop(t){if(!previous)previous=t;accumulator+=Math.min(t-previous,100);previous=t;while(accumulator>=1000/60){tick();accumulator-=1000/60}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
