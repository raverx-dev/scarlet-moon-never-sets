name: Render Stage 3B art proofs
on:
  push:
    branches: [v3-art-stage3b-roof]
    paths:
      - 'dev/art/v3_stage3b_roof/**.json'
      - 'dev/art/v3_stage3b_roof/render_stage3b_preview.py'
      - '.github/workflows/render-stage3b-roof.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python dev/art/v3_stage3b_roof/render_stage3b_preview.py
      - name: Commit deterministic proofs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dev/art/v3_stage3b_roof/stage3b_roof_atlas.png dev/art/v3_stage3b_roof/stage3b_roof_playfield_native.png dev/art/v3_stage3b_roof/stage3b_roof_playfield_preview.png
          git diff --cached --quiet || git commit -m 'art: render Stage 3B deterministic proofs [skip ci]'
          git push
